name: Bug report
description: "Something in Halo CE: Arena Evolved doesn't work as it should."
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. One bug per issue, please. Arena Evolved never provides maps or other game content, so please don't attach maps or disc images. The game closing or freezing? Use the **Crash** form instead.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, Steam Deck, macOS (Apple Silicon), Dedicated server, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you're on, as the window's title shows it (for example 0.7.1-beta).
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where it gets the game's files
      options: [MCC on Steam, An Xbox disc image, Both, Not sure]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options: [Quiver, Zip from this page, Other]
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Online and LAN, MCC and Workshop maps, Menus and settings, Controls, Graphics and HUD, Sound and voices, Bots, Gametypes, Weapon and vehicle packs, Custom Edition maps, Campaign, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to get there, what you saw, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: debug.txt
      description: Attach debug.txt from the game's folder (drag the file here). It says what the game did, without your files.
