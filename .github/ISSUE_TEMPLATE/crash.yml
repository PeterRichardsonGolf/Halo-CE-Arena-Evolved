name: Crash or freeze
description: "Halo CE: Arena Evolved closes, freezes, or won't start."
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: |
        Sorry about that. debug.txt is the most useful thing you can attach: it shows the last thing the game did. A hang with no message: say how long you waited and whether the window answered.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, Steam Deck, macOS (Apple Silicon), Dedicated server, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you're on (for example 0.7.4-beta). Window's title, or the zip's name.
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When
      options: [At start, before the menus, In the menus, Loading a map, In a game, Joining or hosting online, Other]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where it gets the game's files
      description: Halo - The Master Chief Collection on Steam, an Xbox disc image you made from your own disc, or both. If the first-start window said a piece of MCC was missing, say which.
      options: [MCC on Steam, An Xbox disc image, Both (MCC and a disc image), Not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you did just before
      description: "The map, gametype and what was happening. Does it happen every time? If it happens online: are you the host or a joiner, and which build does the other player use (Arena Evolved, OpenCE, ChupathingyCE)? The line \"OpenCE network version ...\" near the top of debug.txt names your network version."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: debug.txt
      description: "Attach debug.txt (drag the file here). It is in the same folder as halo.exe (Windows) or halo (Linux), or in the game's folder inside Quiver's Apps folder. It holds your computer's graphics driver name and file paths, and on Windows your user name, so look through it first. Attach it right after the problem: it keeps earlier runs too. On macOS, also the crash report from ~/Library/Logs/DiagnosticReports (halo-*.ips)."
    validations:
      required: true
